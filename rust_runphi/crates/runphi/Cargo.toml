[package]
name = "runphi"
version = "0.5.8"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Backend selection. Exactly one of `jailhouse` / `xen` must be enabled.
# Default build picks jailhouse:   cargo build
# Xen build:                       cargo build --no-default-features --features xen
[features]
default = ["jailhouse"]
jailhouse = ["dep:backend_jailhouse"]
xen = ["dep:backend_xen"]

[dependencies.clap]
version = "4.1.6"
default-features = false
features = ["std", "suggestions", "derive", "cargo", "help", "usage", "error-context"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
psutil = "3.3.0"
chrono = "0.4.19"
nix = "0.20.1"
regex = "1.5.4"
liboci-cli = { path = "../liboci-cli" }
backend_jailhouse = { path = "../backend_jailhouse", optional = true }
backend_xen       = { path = "../backend_xen",       optional = true }
f2b = { path = "../frontend_to_backend" }
logging = { path = "../logging" }

